# representative: the files listed in scripts/ci/representative-tests.txt.
# full: node --test tests/*.test.mjs, including headless Chrome. tests/net/ is
# not in that glob. Fixture bytes are downloaded only by scripts/ci/fetch-fixtures.sh,
# then checked against pinned sha256 values. A mismatch fails the job.
# This workflow does not set an API key. A test that needs one skips when the
# variable is missing. The jobs do not call arXiv or a translation provider.

name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/ci-actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.ref is refs/heads/<branch> for push and refs/pull/<n>/merge for a
  # pull request. A new commit cancels the previous run of that same ref.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.2
          cache: npm

      - name: 记录 Node 版本
        run: node --version

      - name: npm ci
        run: npm ci

      - name: 检查 runner 上的 Chrome
        id: runner-chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "runner Chrome: $(google-chrome --version)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "runner PATH 上没有 google-chrome"
          fi

      - name: 安装 Chrome
        if: steps.runner-chrome.outputs.present != 'true'
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: 链接 google-chrome
        if: steps.runner-chrome.outputs.present != 'true'
        run: |
          set -euo pipefail
          sudo ln -sfn "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/google-chrome

      - name: 记录 Chrome 版本
        run: google-chrome --version

      - name: 安装 CJK 字体
        run: |
          set -euo pipefail
          # pdf-topbar-geometry renders Chinese toolbar labels and compares baselines.
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f >/dev/null
          echo "CJK families:"
          fc-list :lang=zh family | sort -u

      - name: 缓存夹具
        id: fixture-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/fixtures/Attention_Is_All_You_Need.pdf
            tests/fixtures/Direct_Preference_Optimization_2305.18290.pdf
            tests/fixtures/arxiv-src/1706.03762v1.tar.gz
            tests/fixtures/arxiv-src/1706.03762v7.tar.gz
          key: fixtures-bdfaa68d8984f0dc02beaca527b76f207d99b666d31d1da728ee0728182df697-92cb3a2b71362acda98a789b03d88688fd33cf5fcf13f81d2b1de30ee7d3b67a-377b47ecf3cd8638f7214184cc445cb378b37b5f0ddb42981b1ad288b3a1c03b-2e7a7d9ee2520d22eb23dae0cb148e167be02a30d6cb3f11b1c67723194339c6

      - name: 准备夹具
        run: |
          set -euo pipefail
          echo "fixture-cache-hit=${{ steps.fixture-cache.outputs.cache-hit || 'false' }}"
          bash scripts/ci/fetch-fixtures.sh

      - name: 代表性测试
        run: bash scripts/ci/run-representative.sh

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.2
          cache: npm

      - name: 记录 Node 版本
        run: node --version

      - name: npm ci
        run: npm ci

      - name: 检查 runner 上的 Chrome
        id: runner-chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "runner Chrome: $(google-chrome --version)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "runner PATH 上没有 google-chrome"
          fi

      - name: 安装 Chrome
        if: steps.runner-chrome.outputs.present != 'true'
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: 链接 google-chrome
        if: steps.runner-chrome.outputs.present != 'true'
        run: |
          set -euo pipefail
          sudo ln -sfn "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/google-chrome

      - name: 记录 Chrome 版本
        run: |
          set -euo pipefail
          google-chrome --version
          if [[ -x /opt/google/chrome/chrome ]]; then
            echo "CHROME_BIN=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
          fi

      - name: 安装 CJK 字体
        run: |
          set -euo pipefail
          # pdf-topbar-geometry renders Chinese toolbar labels and compares baselines.
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f >/dev/null
          echo "CJK families:"
          fc-list :lang=zh family | sort -u

      - name: 缓存夹具
        id: fixture-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/fixtures/Attention_Is_All_You_Need.pdf
            tests/fixtures/Direct_Preference_Optimization_2305.18290.pdf
            tests/fixtures/arxiv-src/1706.03762v1.tar.gz
            tests/fixtures/arxiv-src/1706.03762v7.tar.gz
          key: fixtures-bdfaa68d8984f0dc02beaca527b76f207d99b666d31d1da728ee0728182df697-92cb3a2b71362acda98a789b03d88688fd33cf5fcf13f81d2b1de30ee7d3b67a-377b47ecf3cd8638f7214184cc445cb378b37b5f0ddb42981b1ad288b3a1c03b-2e7a7d9ee2520d22eb23dae0cb148e167be02a30d6cb3f11b1c67723194339c6

      - name: 准备夹具
        run: |
          set -euo pipefail
          echo "fixture-cache-hit=${{ steps.fixture-cache.outputs.cache-hit || 'false' }}"
          bash scripts/ci/fetch-fixtures.sh

      - name: 全量测试
        run: bash scripts/ci/run-full.sh
