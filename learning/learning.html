<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习中心 · 沉浸译</title>
  <link rel="stylesheet" href="learning.css" />
</head>
<body>
  <main>
    <p class="brand">沉浸译 / Open Immerse</p>
    <h1>学习中心</h1>
    <p class="lead">收藏单词、短语和句子，支持今日复习与导出。</p>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="all" class="on">全部</button>
      <button type="button" data-tab="review">今日待复习</button>
    </div>
    <div class="export-bar">
      <span>导出当前列表</span>
      <button type="button" data-export="txt">TXT</button>
      <button type="button" data-export="md">Markdown</button>
      <button type="button" data-export="docx">Word</button>
      <button type="button" data-export="pptx">PPT</button>
    </div>
    <p id="exportStatus" class="status" role="status"></p>
    <section id="reviewBox" hidden>
      <h2>复习</h2>
      <div id="card" class="card empty">今日没有到期。</div>
      <div class="grades" id="grades" hidden>
        <button type="button" data-g="1">忘了</button>
        <button type="button" data-g="3">模糊</button>
        <button type="button" data-g="5">记住</button>
      </div>
    </section>
    <ul id="list"></ul>
  </main>
  <script type="module" src="learning.js"></script>
</body>
</html>
