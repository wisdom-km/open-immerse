<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习中心</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="stylesheet" href="learning.css" />
</head>
<body>
  <main>
    <header class="shell">
      <div class="title-row">
        <div class="mark" aria-hidden="true"><span></span><span></span></div>
        <h1>学习中心</h1>
      </div>
      <div class="tabs segmented">
        <button type="button" data-tab="all" class="on">全部</button>
        <button type="button" data-tab="review">今日待复习</button>
      </div>
      <details class="export-menu">
        <summary>导出</summary>
        <div class="export-panel">
          <button type="button" data-export="md">Markdown</button>
          <button type="button" data-export="pdf">PDF</button>
          <button type="button" data-export="docx">Word</button>
        </div>
      </details>
    </header>
    <p id="exportStatus" class="lead" role="status"></p>
    <section id="reviewBox" hidden>
      <div id="card" class="card empty">今日没有到期。</div>
      <div class="grades" id="grades" hidden>
        <button type="button" class="grade-sec" data-g="1">忘了</button>
        <button type="button" class="grade-sec" data-g="3">模糊</button>
        <button type="button" class="grade-pri" data-g="5">记住</button>
      </div>
    </section>
    <ul id="list"></ul>
  </main>
  <script type="module" src="learning.js"></script>
</body>
</html>
