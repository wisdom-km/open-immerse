<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Immerse 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Open Immerse</h1>
      <p class="lead">开源沉浸式翻译 · 用你自己的 API Key 接入主流引擎。</p>
      <p class="note"><a href="../learning/learning.html">学习中心</a> · <a href="../documents/documents.html">文档翻译</a></p>
      <section>
        <h2>通用</h2>
        <div class="grid">
          <label>默认引擎 <select id="provider"></select></label>
          <label>源语言 <select id="sourceLang"></select></label>
          <label>目标语言 <select id="targetLang"></select></label>
          <label>每批条数 <input id="batchSize" type="number" min="1" max="20" /></label>
          <label>译文样式
            <select id="translationStyle">
              <option value="under">原文下方</option>
              <option value="dim">浅色对照</option>
              <option value="card">卡片对照</option>
            </select>
          </label>
          <label>译文字号比例 <input id="fontScale" type="number" min="0.7" max="1.3" step="0.05" /></label>
        </div>
        <label class="check"><input id="skipCode" type="checkbox" /> 跳过代码块</label>
        <label class="check"><input id="hoverEnabled" type="checkbox" /> 鼠标悬停翻译</label>
        <label class="check"><input id="showFab" type="checkbox" /> 显示页面开关按钮</label>
        <label class="check"><input id="subtitleEnabled" type="checkbox" /> 默认开启视频双语字幕</label>
        <label>自动翻译站点（一行一个域名）<textarea id="siteRules" placeholder="nytimes.com
github.com"></textarea></label>
      </section>
      <section>
        <h2>翻译引擎与密钥</h2>
        <div id="providerFields"></div>
      </section>
      <div class="bar">
        <button id="save" type="button">保存设置</button>
        <span id="status"></span>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
