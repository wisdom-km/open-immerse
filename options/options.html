<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沉浸译 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>沉浸译</h1>
      <p class="lead">Open Immerse · 网页双语优先。YouTube / X 字幕在后续功能里，默认关闭。</p>
      <p class="note"><a href="../learning/learning.html">学习中心</a> · <a href="../documents/documents.html">文档翻译</a></p>
      <section>
        <h2>功能模块</h2>
        <div id="featureList"></div>
        <details class="later">
          <summary>高级（YouTube / X，默认关闭）</summary>
          <div id="laterList"></div>
        </details>
      </section>
      <section>
        <h2>语言与通用</h2>
        <div class="grid">
          <label>默认引擎 <select id="provider"></select></label>
          <label>源语言 <select id="sourceLang"></select></label>
          <label>目标语言 <select id="targetLang"></select></label>
          <label>本次翻译条数
            <select id="translateLimit">
              <option value="all">全部</option>
              <option value="preview">仅标题+首段</option>
            </select>
          </label>
          <label>每批条数（分批，不是总数） <input id="batchSize" type="number" min="1" max="20" /></label>
          <p class="hint field-hint">「每批条数」只决定一次请求翻几段；本页总共翻多少由「本次翻译条数」决定。选「仅标题+首段」可省 token 做预览。</p>
          <label>翻译范围
            <select id="translateScope">
              <option value="article">仅正文（默认）</option>
              <option value="page">更大范围（仍跳过顶栏导航）</option>
            </select>
          </label>
          <label>译文样式
            <select id="translationStyle">
              <option value="under">原文下方 + 虚线</option>
              <option value="line">原文下方 + 实线</option>
              <option value="box">原文下方 + 边框</option>
              <option value="dim">浅色虛线</option>
              <option value="card">左条卡片</option>
            </select>
          </label>
          <label>译文字号比例 <input id="fontScale" type="number" min="0.7" max="1.3" step="0.05" /></label>
        </div>
        <label class="check"><input id="skipCode" type="checkbox" /> 跳过代码块</label>
        <label class="check"><input id="autoOnNewPages" type="checkbox" /> 打开网页时自动翻译（默认关闭，需点右下角「译」）</label>
        <label>自动翻译站点（一行一个域名，仅这些站进页就翻）<textarea id="siteRules" placeholder="nytimes.com"></textarea></label>
      </section>
      <section>
        <h2>翻译引擎与密钥</h2>
        <p class="hint">只显示当前默认引擎的配置。改上方下拉框即可换家；其他引擎已保存的 Key 不会丢。</p>
        <div id="providerFields"></div>
      </section>

      <section>
        <h2>备份与恢复</h2>
        <p class="hint">导出含引擎密钥，文件请妥善保存。Chrome「移除」扩展会清空本地设置；重装后可在此导入恢复。日常更新请用「重新加载」，不要「移除」。</p>
        <div class="bar">
          <button id="exportSettings" type="button">导出设置</button>
          <button id="importSettings" type="button">导入设置</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </section>
      <div class="bar">
        <button id="save" type="button">保存设置</button>
        <span id="status"></span>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
