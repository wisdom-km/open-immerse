<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF 阅读</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="preload" href="fonts/OISerifLatin-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="reader-tokens.css" />
  <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body class="oi-reader-app" data-reader-theme="warm">
  <header class="toolbar">
    <div class="title-row">
      <div class="mark" aria-hidden="true"><span></span><span></span></div>
      <h1>PDF 阅读</h1>
    </div>
    <div class="toolbar-actions">
      <div id="docStatus" class="doc-status" data-state="idle">
        <svg class="doc-ring" viewBox="0 0 14 14" aria-hidden="true">
          <circle cx="7" cy="7" r="5.5" class="trk"></circle>
          <circle cx="7" cy="7" r="5.5" class="val" pathLength="100" stroke-dasharray="0 100"></circle>
        </svg>
        <span class="doc-text" aria-hidden="true"></span>
        <span class="sr-only" role="status" aria-live="polite"></span>
      </div>
      <button type="button" id="pick" class="btn-secondary">打开 PDF</button>
      <input id="file" class="file-input" type="file" accept="application/pdf,.pdf" tabindex="-1" aria-hidden="true" />
      <button type="button" id="translatePage" class="btn-primary" disabled>翻译</button>
      <button type="button" id="retranslatePage" class="btn-secondary" disabled>重译本页</button>
      <button type="button" id="stopTranslate" class="btn-primary" hidden disabled>停止</button>
      <button type="button" id="restoreOriginal" class="btn-ghost" disabled>原文</button>
      <button type="button" id="prev" class="btn-ghost" disabled>上一页</button>
      <p id="pager" class="pager" aria-live="polite">0 / 0</p>
      <button type="button" id="next" class="btn-ghost" disabled>下一页</button>
      <span class="toolbar-rule" aria-hidden="true"></span>
      <button type="button" id="aaButton" class="btn-ghost aa-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="aaPanel">Aa</button>
      <div class="more-wrap">
        <button type="button" id="moreButton" class="more-button hit-pad" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu" aria-label="更多">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="3.25" cy="8" r="1.15" fill="currentColor"></circle>
            <circle cx="8" cy="8" r="1.15" fill="currentColor"></circle>
            <circle cx="12.75" cy="8" r="1.15" fill="currentColor"></circle>
          </svg>
        </button>
        <div id="moreMenu" class="more-menu" role="menu" aria-label="更多" hidden>
          <button type="button" id="swapPanes" class="more-item hit-pad" role="menuitemcheckbox" aria-checked="false" aria-keyshortcuts="s">互换两栏<span class="menu-key">s</span></button>
          <div class="more-sep" role="separator"></div>
          <button type="button" id="exportMd" class="more-item hit-pad btn-export" role="menuitem" disabled aria-disabled="true">导出 MD</button>
          <button type="button" id="exportPdf" class="more-item hit-pad btn-export" role="menuitem" disabled aria-disabled="true">导出 PDF</button>
        </div>
      </div>
    </div>
  </header>
  <div id="aaPanel" class="aa-panel oi-reader" data-reader-theme="warm" hidden role="dialog" aria-label="阅读设置">
    <div class="aa-group">
      <div class="aa-font-row">
        <span class="aa-label" id="aaFontLabel">字号</span>
        <button type="button" id="aaFontDown" class="aa-icon-btn" aria-label="减小字号">−</button>
        <span id="aaFontValue" class="aa-font-value" aria-live="polite">16px</span>
        <button type="button" id="aaFontUp" class="aa-icon-btn" aria-label="增大字号">+</button>
        <button type="button" id="aaFontDefault" class="aa-text-btn">默认</button>
      </div>
      <div id="aaFontScale" class="aa-scale" role="radiogroup" aria-labelledby="aaFontLabel"></div>
    </div>
    <div class="aa-group">
      <div class="aa-label" id="aaThemeLabel">背景</div>
      <div id="aaThemes" class="aa-themes" role="radiogroup" aria-label="阅读背景"></div>
      <p id="aaFontHint" class="aa-font-hint" hidden>装上思源宋体会自动换成宋体。重启浏览器后生效<a class="aa-font-hint-link" href="https://source.typekit.com/source-han-serif/cn/" target="_blank" rel="noopener noreferrer">如何安装 ↗</a></p>
    </div>
    <div class="aa-group">
      <label class="aa-switch-row" for="aaSingleKey">
        <span>单键快捷键</span>
        <input type="checkbox" id="aaSingleKey" class="aa-switch" role="switch" checked />
      </label>
      <p class="aa-note">字号快捷键：- / = / 0（浏览器缩放 ⌘− / ⌘+ 不受影响）</p>
    </div>
  </div>
  <p id="status" role="status">还没有打开 PDF。</p>
  <div class="workspace">
    <section class="pane-pdf" id="pdfPane" aria-label="原文栏">
      <header class="source-head">
        <span class="source-head-name">原文栏</span>
        <span id="sourcePageLabel" class="source-head-page">第 0/0 页</span>
        <span class="source-head-gap"></span>
        <span id="sourceStatus" class="source-head-status"></span>
        <button type="button" id="followSwitch" class="follow-switch hit-pad" role="switch" aria-checked="true" title="译文栏读到哪，原文栏就跟到哪（f）">
          <span class="follow-box" aria-hidden="true"></span>
          <span class="follow-label">跟随</span>
        </button>
      </header>
      <div id="pages" class="pages"></div>
      <div id="zoomChip" class="zoom-gutter" role="group" aria-label="缩放">
        <button type="button" id="zoomOut" class="zoom-gutter-btn" disabled>缩小</button>
        <p id="zoomLabel" class="zoom-gutter-label">100%</p>
        <button type="button" id="zoomIn" class="zoom-gutter-btn" disabled>放大</button>
      </div>
    </section>
    <div class="split-handle" role="separator" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0" aria-label="调整分栏"></div>
    <aside class="pane-translate" aria-label="译文栏">
      <div id="reader" class="oi-reader" data-reader-theme="warm">
        <div id="translateScroll" class="pane-translate-scroll">
          <div id="capsuleBar" class="rf-capsule-bar">
            <button type="button" id="pageCapsule" class="rf-page-capsule" hidden></button>
          </div>
          <div id="readerFlow" class="reader-flow" tabindex="0"></div>
          <p id="emptyRead" class="empty-read">点击翻译</p>
          <p id="pendingRead" class="empty-read" hidden>正在翻译，请稍候…</p>
          <p id="noTextLayerHint" class="m2-stub" hidden>本页没有文字层，无法提取阅读文本。扫描件翻译将在后续版本支持。</p>
        </div>
        <div id="readerFade" class="rf-fade" aria-hidden="true" hidden></div>
      </div>
    </aside>
  </div>
  <script src="./vendor/katex/katex.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
