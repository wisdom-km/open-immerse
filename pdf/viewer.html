<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF 阅读</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header class="toolbar">
    <div class="title-row">
      <div class="mark" aria-hidden="true"><span></span><span></span></div>
      <h1>PDF 阅读</h1>
    </div>
    <div class="toolbar-actions">
      <button type="button" id="pick" class="btn-secondary">打开 PDF</button>
      <input id="file" class="file-input" type="file" accept="application/pdf,.pdf" hidden />
      <button type="button" id="prev" class="btn-ghost" disabled>上一页</button>
      <p id="pager" class="pager" aria-live="polite">0 / 0</p>
      <button type="button" id="next" class="btn-ghost" disabled>下一页</button>
      <button type="button" id="zoomOut" class="btn-ghost" disabled>缩小</button>
      <p id="zoomLabel" class="zoom-label">100%</p>
      <button type="button" id="zoomIn" class="btn-ghost" disabled>放大</button>
      <label class="scope-field" for="pdfTranslateScope">
        <span>范围</span>
        <select id="pdfTranslateScope" disabled>
          <option value="page" selected>当前页</option>
          <option value="document">全文</option>
        </select>
      </label>
      <button type="button" id="translatePage" class="btn-primary" disabled>翻译</button>
      <button type="button" id="stopTranslate" class="btn-ghost" disabled>停止</button>
      <button type="button" id="restoreOriginal" class="btn-secondary" disabled>原文</button>
    </div>
  </header>
  <p id="status" role="status">还没有打开 PDF。</p>
  <div class="workspace">
    <section class="pane-pdf" id="pdfPane" aria-label="PDF">
      <div id="pages" class="pages"></div>
    </section>
    <aside class="pane-translate" aria-label="译文">
      <div id="readout" class="readout"></div>
      <p id="emptyRead" class="empty-read">点击翻译</p>
      <p id="noTextLayerHint" class="m2-stub" hidden>扫描件翻译将在后续版本支持。</p>
    </aside>
  </div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
