<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Immerse</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="mark">OI</div>
      <div>
        <h1>Open Immerse</h1>
        <p>按需开关功能，不互相打扰</p>
      </div>
    </header>

    <section>
      <h2>本页</h2>
      <label class="switch-row"><span>翻译当前页面</span><input id="enabled" type="checkbox" /></label>
      <label class="switch-row"><span>本站自动翻译</span><input id="autoSite" type="checkbox" /></label>
    </section>

    <section>
      <h2>功能开关</h2>
      <div id="featureList"></div>
    </section>

    <section>
      <h2>语言 / 引擎</h2>
      <label>翻译引擎<select id="provider"></select></label>
      <div class="row">
        <label>源语言<select id="sourceLang"></select></label>
        <label>目标语言<select id="targetLang"></select></label>
      </div>
    </section>

    <div class="actions">
      <button id="openLearning" type="button">学习中心</button>
      <button id="openDocs" type="button">文档翻译</button>
      <button id="openOptions" type="button">更多设置</button>
    </div>
    <p class="hint">关掉 YouTube / X 后，视频站不会跑字幕逻辑。只开「网页翻译」时就是纯网页双语。</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
