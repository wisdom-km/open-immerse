<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沉浸译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true"><span></span><span></span></div>
      <div>
        <h1>沉浸译</h1>
        <p>Open Immerse · 网页双语</p>
      </div>
    </header>

    <section>
      <h2>本页</h2>
      <label class="switch-row"><span>翻译当前页面</span><input id="enabled" type="checkbox" /></label>
      <label class="switch-row"><span>本站自动翻译</span><input id="autoSite" type="checkbox" /></label>
      <label>翻译范围
        <select id="translateScope">
          <option value="article">仅正文（默认）</option>
          <option value="page">更大范围（仍跳过顶栏导航）</option>
        </select>
      </label>
    </section>

    <section>
      <h2>功能开关</h2>
      <div id="featureList"></div>
      <details class="later">
        <summary>后续功能（默认关闭）</summary>
        <div id="laterList"></div>
      </details>
    </section>

    <section>
      <h2>语言 / 引擎</h2>
      <label>翻译引擎<select id="provider"></select></label>
      <div class="row">
        <label>源语言<select id="sourceLang"></select></label>
        <label>目标语言<select id="targetLang"></select></label>
      </div>
    </section>

    <div class="actions">
      <button id="openLearning" type="button">学习中心</button>
      <button id="openDocs" type="button">文档翻译</button>
      <button id="openOptions" type="button">更多设置</button>
    </div>
    <p class="hint">关掉「翻译当前页面」、点 FAB「原」、或按 Alt+T 关闭，都会完整恢复原文。</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
